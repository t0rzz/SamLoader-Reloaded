name: KMP Native Builds

on:
  workflow_dispatch:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  linux-native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
      - name: Compile common linuxX64
        uses: gradle/gradle-build-action@v2
        with:
          gradle-version: wrapper
          arguments: :common:compileKotlinLinuxX64 --stacktrace --no-daemon

  windows-native:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
      - name: Compile common mingwX64
        uses: gradle/gradle-build-action@v2
        with:
          gradle-version: wrapper
          arguments: :common:compileKotlinMingwX64 --stacktrace --no-daemon
      - name: Build Desktop (JVM)
        uses: gradle/gradle-build-action@v2
        with:
          gradle-version: wrapper
          arguments: :desktop:build --stacktrace --no-daemon
